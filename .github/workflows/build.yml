name: Build

# Builds the mod on every push and publishes the jar as the "dev-build" release,
# so the newest boh-port.jar is always at
# https://github.com/wolvergun/boh-port-1.7.10/releases/tag/dev-build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: port
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # JDK 21 runs Gradle, JDK 25 is the compile toolchain (enableModernJavaSyntax = modern)
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace assemble

      - name: Pick the mod jar
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-dev\.jar$\|-sources\.jar$' | head -1)
          echo "Built $jar"
          cp "$jar" boh-port.jar

      - name: Publish the dev-build release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-build --yes --cleanup-tag || true
          gh release create dev-build boh-port.jar --target "$GITHUB_SHA" --prerelease \
            --title "Latest dev build" \
            --notes "Built automatically from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download boh-port.jar and put it in the BoH Test mods folder (never SnyderCraft)."
