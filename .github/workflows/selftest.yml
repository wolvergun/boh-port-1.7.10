name: Self-test

# Starts a headless dedicated server with -Dboh.selftest=true (see compat/debug/SelfTest): it times chunk
# generation in the mod dimensions, counts block entities, checks room arrival in the void dimensions,
# then stops the server. Results are in the run summary and the server.log artifact.

on:
  push:
  workflow_dispatch:

concurrency:
  group: selftest
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: port
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v5

      - name: Run server self-test
        run: |
          chmod +x gradlew
          mkdir -p run/server
          echo "eula=true" > run/eula.txt
          echo "eula=true" > run/server/eula.txt
          printf "level-seed=12345\nonline-mode=false\n" > run/server.properties
          cp run/server.properties run/server/server.properties
          # runServer25: Java 25 + lwjgl3ify/RetroFuturaBootstrap like the real pack (plain runServer is Java 8, which
          # cannot read the mod's Java 25 classes); the delayed "stop" ends the server if the self-test never runs (a
          # process substitution, so the step doesn't wait for the sleep once the server has stopped itself)
          timeout 1500 ./gradlew --stacktrace runServer25 --mcJvmArgs=-Dboh.selftest=true < <(sleep 900; echo stop) 2>&1 | tee server.log || true
          grep -F "[BOH-SELFTEST]" server.log > selftest.txt || echo "no self-test output" > selftest.txt
          cat selftest.txt
          { echo '### Self-test'; echo '```'; cat selftest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # fail the run when the server crashed before the self-test finished
          grep -qF "[BOH-SELFTEST] done" server.log || { grep -m1 -A3 -E "Exception|Error:" server.log; echo "::error::self-test did not finish"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: port/server.log
          retention-days: 14
